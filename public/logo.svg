<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vibeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2" />
    </linearGradient>
    <filter id="vibeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ring Glow -->
  <circle cx="50" cy="50" r="44" stroke="url(#glowGrad)" stroke-width="2.5" stroke-dasharray="4 2" />
  
  <!-- Main Glass Circle Background -->
  <circle cx="50" cy="50" r="38" fill="url(#vibeGrad)" filter="url(#vibeGlow)" />
  
  <!-- Circular Soundwave Pulse Rings (Original Wave Design) -->
  <path d="M 50 18 A 32 32 0 0 1 82 50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <path d="M 50 26 A 24 24 0 0 1 74 50" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  
  <path d="M 50 82 A 32 32 0 0 1 18 50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <path d="M 50 74 A 24 24 0 0 1 26 50" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Central Oscillating Wave Pulse -->
  <path d="M 30 50 C 35 38, 40 62, 45 50 C 50 38, 55 62, 60 50 C 65 42, 68 56, 70 50" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>
